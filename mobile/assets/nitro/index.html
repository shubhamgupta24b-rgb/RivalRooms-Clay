    <script>
      // Surface engine failures to Flutter, including a lost host WebGL world.
      const reportNitroError = message => window.NitroBridge?.postMessage(
        JSON.stringify({kind: 'engine_error', message: String(message)}));
      window.addEventListener('error', event => reportNitroError(event.message || 'Game asset failed to load'));
      window.addEventListener('unhandledrejection', event => reportNitroError(event.reason));
      document.addEventListener('webglcontextlost', () => reportNitroError('The graphics context was lost. Leave this match and start a new one.'), true);
    </script>
